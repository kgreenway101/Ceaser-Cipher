<DOCTYPE html>

<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Ceaser Cipher </title>

        <style>

            html {
                --primary: #fa7507;
                --font: 'Andale Mono', 'Menlo', 'Courier New', Courier, monospace;
                --dark: #222;
                --white: #FFF;
                --darkGray: #A2A2A2;
                --gray: #888;
            }

            body {
                min-height: 100vh;
                background-image: url('background.jpg');
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
                background-color: #000;
                font-family: var(--font);
                color: var(--white);
                padding: 20px;
            }

            h1 {
                color: var(--primary);
                border-bottom: 5px solid var(--primary);
                padding: 20px;
                margin-top: 0px;
                font-size: 3em;
                font-weight: 100
            }

            label {
                margin: 20px;
                color: var(--darkGray);

            }

            input {
                display: block;
                font-family: var(--font);
                font-size: 2em;
                padding: 10px;
                font-weight: 100;
                border: 3px solid var(--primary);
                margin: 20px;

                background-color: var(--white);
                width: calc(100% - 65px);

            }

            #encrypted {
                border-color: var(--primary);
                background-color: var(--white);
                color: var(--white);
            }

            .mainContainer {
                max-width: 1000px;
                margin: 0 auto;
            }

            hr {
                border: 1px solid var(--primary);
            }

            .gear img {
                width: 50px;
                display: block;
                margin: 0 auto;
                margin-top: 50px;

            }

        </style>


    </head>

    <body>
        <div>
            class="mainContainer"
            <h1>Ceasar's Cipher</h1>

            <label for="Original">Message For Encryption</label>
            <input id="Original" type="text" value="pizzapizzapizza">

            <label for="Shift">Shift</label>
            <input id="Shift">
            
            <hr>

            <label for="Encrypted">Encrypted Message</label>
            <input id="Encrypted" type="text" value="" readonly>


            <a class="gear">
                <img src="/Users/karlsaccount/Ceaser_Cipher/Gear.jpeg" width="200" height="200">
            </a>
        </div>

        <script>
            let originalInput = document.querySelector("#Original");
            let shiftInput = document.querySelector("#Shift");
            let encryptedInput = document.querySelector("#Encrypted");

            let originalMessage = originalInput.value;

            originalInput.addEventListener("input", characterEntered, false);

            function characterEntered(e) {
                // only accept lowercase letters
                originalMessage = e.target.value;
                originalMessage = originalMessage.toLowerCase();
                originalMessage = originalMessage.replace(/[^a-z]/, '');

                e.target.value = originalMessage;

                startEncryption();
            }
            

            function startEncryption(){
                let shift = 1;
                let encryptedMessage = "";

                for (letter of originalMessage){
                    encryptedMessage += shiftLetter(letter, shift);
                }
                console.log(encryptedMessage);
            }

            startEncryption();

            function shiftLetter(letter, shift){
                let newLetter = "";
                let letterCode = letter.charCodeAt(0);
                let newLetterCode = letterCode + shift;

                if (newLetterCode < 97) {
                    newLetterCode += 26;

                } else if (newLetterCode > 122) {
                    newLetterCode -= 26;
                }

                newLetter = String.fromCharCode(newLetterCode);

                return newLetter;

            }

        </script>


    </body>
</html>
